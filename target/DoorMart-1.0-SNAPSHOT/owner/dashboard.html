<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard - DoorMart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    nav { background: #e74c3c; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    nav h2 { color: white; font-size: 20px; }
    nav a { color: white; text-decoration: none; font-size: 14px; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 24px; color: #2c3e50; margin-bottom: 0.5rem; }
    p { color: #666; margin-bottom: 1.5rem; }
    .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .card { background: white; border-radius: 12px; padding: 1.5rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { font-size: 32px; color: #e74c3c; margin-bottom: 0.5rem; }
    .card p { font-size: 14px; color: #666; margin: 0; }
    .section { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .section h2 { font-size: 18px; color: #2c3e50; margin-bottom: 1rem; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 1rem; }
    button { padding: 10px 24px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    button:hover { background: #c0392b; }
    .btn-small { padding: 6px 14px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { padding: 10px; background: #f5f5f5; text-align: left; border-bottom: 1px solid #ddd; color: #2c3e50; }
    td { padding: 10px; border-bottom: 1px solid #eee; color: #444; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .badge-green { background: #e8f8e8; color: #27ae60; }
    .badge-red { background: #fde8e8; color: #e74c3c; }
    .badge-orange { background: #fef5e8; color: #e67e22; }
  </style>
</head>
<body>

  <nav>
    <h2>🚪 DoorMart</h2>
    <a href="/DoorMart/login.html">Logout</a>
  </nav>

  <div class="container">
    <h1>Owner Dashboard</h1>
    <p>Manage your shop, products and orders!</p>

    <!-- Stats -->
    <div class="card-grid">
      <div class="card">
        <h3 id="totalProducts">0</h3>
        <p>Total Products</p>
      </div>
      <div class="card">
        <h3 id="totalOrders">0</h3>
        <p>Total Orders</p>
      </div>
      <div class="card">
        <h3 id="pendingOrders">0</h3>
        <p>Pending Orders</p>
      </div>
    </div>

    <!-- Add Product -->
    <div class="section">
      <h2>Add New Product</h2>
      <input type="text" id="productName" placeholder="Product Name" />
      <textarea id="productDesc" placeholder="Product Description" rows="2"></textarea>
      <input type="number" id="productPrice" placeholder="Price (Rs.)" />
      <button onclick="addProduct()">Add Product</button>
    </div>

    <!-- Products List -->
    <div class="section">
      <h2>My Products</h2>
      <div id="products-area">No products added yet.</div>
    </div>

    <!-- Orders -->
    <div class="section">
      <h2>Recent Orders</h2>
      <div id="orders-area">No orders yet.</div>
    </div>

  </div>

  <script>
    // Dummy data for now
    const products = [];
    const orders = [];

    function addProduct() {
      const name = document.getElementById('productName').value.trim();
      const desc = document.getElementById('productDesc').value.trim();
      const price = document.getElementById('productPrice').value.trim();

      if (!name || !price) {
        alert('Please fill product name and price!');
        return;
      }

      products.push({ name, desc, price, available: true });

      document.getElementById('productName').value = '';
      document.getElementById('productDesc').value = '';
      document.getElementById('productPrice').value = '';

      renderProducts();
      updateStats();
    }

    function toggleAvailability(i) {
      products[i].available = !products[i].available;
      renderProducts();
    }

    function renderProducts() {
      const area = document.getElementById('products-area');
      if (products.length === 0) {
        area.innerHTML = 'No products added yet.';
        return;
      }
      let rows = products.map((p, i) => `
        <tr>
          <td>${p.name}</td>
          <td>${p.desc}</td>
          <td>Rs. ${p.price}</td>
          <td><span class="badge ${p.available ? 'badge-green' : 'badge-red'}">${p.available ? 'Available' : 'Sold Out'}</span></td>
          <td><button class="btn-small" onclick="toggleAvailability(${i})">${p.available ? 'Mark Sold' : 'Mark Available'}</button></td>
        </tr>
      `).join('');
      area.innerHTML = `
        <table>
          <thead><tr><th>Name</th><th>Description</th><th>Price</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function updateStats() {
      document.getElementById('totalProducts').textContent = products.length;
      document.getElementById('totalOrders').textContent = orders.length;
      document.getElementById('pendingOrders').textContent = orders.filter(o => o.status === 'pending').length;
    }
  </script>

</body>
</html>
