<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DoorMart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .wrapper { width: 100%; max-width: 400px; padding: 1rem; }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand-icon { width: 56px; height: 56px; background: #C0392B; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
    .brand-icon i { color: white; font-size: 28px; }
    .brand h1 { font-size: 22px; font-weight: 500; color: #2c3e50; }
    .brand p { font-size: 14px; color: #888; margin-top: 4px; }
    .card { background: white; border-radius: 16px; padding: 24px; border: 0.5px solid #e0e0e0; }
    .form-group { margin-bottom: 16px; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; font-weight: 500; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 18px; }
    input { width: 100%; padding: 10px 12px 10px 38px; border: 0.5px solid #ddd; border-radius: 10px; font-size: 14px; color: #333; outline: none; }
    input:focus { border-color: #C0392B; }
    .btn { width: 100%; padding: 12px; background: #C0392B; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    .btn:hover { background: #A93226; }
    .divider { text-align: center; font-size: 13px; color: #aaa; margin: 16px 0; }
    .register-link { text-align: center; font-size: 14px; color: #666; }
    .register-link a { color: #C0392B; text-decoration: none; font-weight: 500; }
    .success { background: #EAF3DE; color: #3B6D11; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
    .error { background: #FCEBEB; color: #A32D2D; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-home"></i></div>
      <h1>DoorMart</h1>
      <p>Local shops, delivered to your door</p>
    </div>

    <div class="card">
      <div id="message"></div>

      <form action="http://localhost:8080/DoorMart/LoginServlet" method="POST">
        <div class="form-group">
          <label>Email address</label>
          <div class="input-wrap">
            <i class="ti ti-mail"></i>
            <input type="email" name="email" placeholder="your@email.com" required />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="ti ti-lock"></i>
            <input type="password" name="password" placeholder="Your password" required />
          </div>
        </div>
        <button class="btn" type="submit">Login</button>
      </form>

      <div class="divider">Don't have an account?</div>
      <div class="register-link"><a href="register.html">Create account</a></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('success') === 'registered') {
      document.getElementById('message').innerHTML = '<div class="success">Account created successfully! Please login.</div>';
    } else if (params.get('error') === 'invalid') {
      document.getElementById('message').innerHTML = '<div class="error">Invalid email or password!</div>';
    } else if (params.get('error') === 'failed') {
      document.getElementById('message').innerHTML = '<div class="error">Login failed! Try again.</div>';
    }
  </script>
</body>
</html>
