<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - DoorMart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .wrapper { width: 100%; max-width: 400px; }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand-icon { width: 56px; height: 56px; background: #C0392B; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
    .brand-icon i { color: white; font-size: 28px; }
    .brand h1 { font-size: 22px; font-weight: 500; color: #2c3e50; }
    .brand p { font-size: 14px; color: #888; margin-top: 4px; }
    .card { background: white; border-radius: 16px; padding: 24px; border: 0.5px solid #e0e0e0; }
    .form-group { margin-bottom: 16px; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; font-weight: 500; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 18px; }
    input, select { width: 100%; padding: 10px 12px 10px 38px; border: 0.5px solid #ddd; border-radius: 10px; font-size: 14px; color: #333; outline: none; }
    input:focus, select:focus { border-color: #C0392B; }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .role-card { border: 0.5px solid #ddd; border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; }
    .role-card.selected { border-color: #C0392B; background: #FCEBEB; }
    .role-card i { font-size: 24px; color: #C0392B; display: block; margin-bottom: 6px; }
    .role-card span { font-size: 13px; font-weight: 500; color: #333; }
    .role-card p { font-size: 11px; color: #888; margin-top: 2px; }
    .btn { width: 100%; padding: 12px; background: #C0392B; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    .btn:hover { background: #A93226; }
    .divider { text-align: center; font-size: 13px; color: #aaa; margin: 16px 0; }
    .login-link { text-align: center; font-size: 14px; color: #666; }
    .login-link a { color: #C0392B; text-decoration: none; font-weight: 500; }
    .error { background: #FCEBEB; color: #A32D2D; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
    .success { background: #EAF3DE; color: #3B6D11; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-home"></i></div>
      <h1>Create account</h1>
      <p>Join DoorMart today</p>
    </div>

    <div class="card">
      <div id="message"></div>

      <form action="http://localhost:8080/DoorMart/RegisterServlet" method="POST">
        <div class="form-group">
          <label>Full name</label>
          <div class="input-wrap">
            <i class="ti ti-user"></i>
            <input type="text" name="name" placeholder="Your full name" required />
          </div>
        </div>
        <div class="form-group">
          <label>Email address</label>
          <div class="input-wrap">
            <i class="ti ti-mail"></i>
            <input type="email" name="email" placeholder="your@email.com" required />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="ti ti-lock"></i>
            <input type="password" name="password" placeholder="Create a password" required />
          </div>
        </div>
        <div class="form-group">
          <label>I am a</label>
          <div class="role-grid">
            <div class="role-card selected" onclick="selectRole('customer', this)">
              <i class="ti ti-user"></i>
              <span>Customer</span>
              <p>I want to order</p>
            </div>
            <div class="role-card" onclick="selectRole('owner', this)">
              <i class="ti ti-building-store"></i>
              <span>Shop Owner</span>
              <p>I want to sell</p>
            </div>
          </div>
          <input type="hidden" name="role" id="role" value="customer" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <div class="input-wrap">
            <i class="ti ti-phone"></i>
            <input type="text" name="phone" placeholder="07X XXXXXXX" />
          </div>
        </div>
        <div class="form-group">
          <label>Address</label>
          <div class="input-wrap">
            <i class="ti ti-map-pin"></i>
            <input type="text" name="address" placeholder="Your address" />
          </div>
        </div>
        <button class="btn" type="submit">Create account</button>
      </form>

      <div class="divider">Already have an account?</div>
      <div class="login-link"><a href="login.html">Login here</a></div>
    </div>
  </div>

  <script>
    function selectRole(role, el) {
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('role').value = role;
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'exists') {
      document.getElementById('message').innerHTML = '<div class="error">Email already exists! Try another.</div>';
    } else if (params.get('error') === 'failed') {
      document.getElementById('message').innerHTML = '<div class="error">Registration failed! Try again.</div>';
    }
  </script>
</body>
</html>
